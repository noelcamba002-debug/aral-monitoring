<script>
// Ang Web App URL na kinopya mo sa Apps Script
const GAS_URL = "https://script.google.com/macros/s/AKfycbxjRijq6288VzPNd-Fb8iGJnPHTAeuGjirB2-pY3fqcWirpN3aduX_iOX25Es0EWfLP6Q/exec";

const CURRICULUM = [
  {id:"b1", w:"Week 1", t:"Word Concept (Print Carries Meaning)", f:"Filipino · M,S,A,I,O,B,E"},
  {id:"b2", w:"Week 2", t:"Phoneme Manipulation + Diphthongs", f:"Filipino · U,T,K,L,N,G"},
  {id:"b3", w:"Week 3", t:"Syllable Manipulation", f:"Filipino · Ng,P,R,D,H,N"},
  {id:"b4", w:"Week 4", t:"Phoneme Manipulation", f:"Filipino · W,Y, F,J,C,Q,V,X,Z"},
  {id:"b5", w:"Week 5", t:"Word Concept (1:1 Correspondence)", f:"English · a,m,t,s,i,f,d"},
  {id:"b6", w:"Week 6", t:"Alliteration", f:"English · r,o,g,l,h,u,c"},
  {id:"b7", w:"Week 7", t:"Syllable Manipulation", f:"English · b,n,k,v,e,w,j"},
  {id:"b8", w:"Week 8", t:"Phoneme Mani + Blends + CVCe", f:"English · bl,cl,st / cake,bike"}
];

let state = JSON.parse(localStorage.getItem('aral_teacher_app') || '{}');
if(!state.learner) state.learner = {teacher:"", name:"", grade:""};
if(!state.status) state.status = {};
if(!state.notes) state.notes = {};

function loadConfig(){
  document.getElementById('teacherName').value = state.learner.teacher || ""; 
  document.getElementById('learnerName').value = state.learner.name || ""; 
  document.getElementById('gradeLevel').value = state.learner.grade || "";
}

function renderWeeks(){
  const container = document.getElementById('weeksContainer');
  container.innerHTML = '<div class="card"><h2>📚 KS2 Basic (Weeks 1-8)</h2>' + 
    CURRICULUM.map(f => {
      const st = state.status[f.id] || ""; const note = state.notes[f.id] || "";
      return `<div class="week-item"><div class="week-title">${f.w}: ${f.t}</div><div class="week-focus">${f.f}</div><div class="status-btns"><button class="${st==='ok'?'active-ok':''}" onclick="setStatus('${f.id}','ok')">✅ Observed</button><button class="${st==='part'?'active-part':''}" onclick="setStatus('${f.id}','part')">🟡 Partially</button><button class="${st==='no'?'active-no':''}" onclick="setStatus('${f.id}','no')">❌ Not Observed</button></div><textarea placeholder="Tutor notes..." oninput="setNote('${f.id}', this.value)">${note}</textarea></div>`;
    }).join('') + '</div>';
}

function setStatus(id, st){ 
  state.status[id] = st; 
  localStorage.setItem('aral_teacher_app', JSON.stringify(state)); 
  renderWeeks(); 
  syncToCloud(); 
}

function setNote(id, val){ 
  state.notes[id] = val; 
  localStorage.setItem('aral_teacher_app', JSON.stringify(state)); 
  clearTimeout(window.typingTimer); 
  window.typingTimer = setTimeout(syncToCloud, 1500); 
}

function updateLocalInfo(){ 
  state.learner.teacher = document.getElementById('teacherName').value; 
  state.learner.name = document.getElementById('learnerName').value; 
  state.learner.grade = document.getElementById('gradeLevel').value; 
  localStorage.setItem('aral_teacher_app', JSON.stringify(state)); 
  syncToCloud(); 
}

function syncToCloud() {
  if (!state.learner.name || !state.learner.teacher) return;
  
  const payload = {
    teacherName: state.learner.teacher,
    learnerName: state.learner.name,
    grade: state.learner.grade,
    statuses: state.status,
    notes: state.notes
  };

  fetch(GAS_URL, {
    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    // Optional: Magpakita ng toast notification
    console.log("Synced to Google Sheets");
  }).catch(err => console.error("Sync error:", err));
}

window.onload = () => { loadConfig(); renderWeeks(); };
</script>
